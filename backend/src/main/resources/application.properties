spring.application.name=ResumeIQ

# ─── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resumeiq}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ─── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── File Upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ─── CORS (override with env var in production) ────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

# ─── Admin Seeder (set both env vars to auto-create first admin on startup) ─────
admin.seed.email=${ADMIN_SEED_EMAIL:}
admin.seed.password=${ADMIN_SEED_PASSWORD:}

# ─── AI (Google Gemini) ────────────────────────────────────────────────────────
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}